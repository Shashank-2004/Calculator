<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer">
        <div class="display">
            <span id="display-text"></span>
            <span class="cursor">|</span>
        </div>
        <div class="gap"></div>
        <div class="options">
            <button id="Clear" class="cal">C</button>
            <button id="bracket" class="cal">()</button>
            <button id="percentage" class="cal">%</button>
            <button id="divide" class="cal">/</button>
            <button id="num" class="cal">7</button>
            <button id="num" class="cal">8</button>
            <button id="num" class="cal">9</button>
            <button id="multiply" class="cal">*</button>
            <button id="num" class="cal">4</button>
            <button id="num" class="cal">5</button>
            <button id="num" class="cal">6</button>
            <button id="subtract" class="cal">-</button>
            <button id="num" class="cal">1</button>
            <button id="num" class="cal">2</button>
            <button id="num" class="cal">3</button>
            <button id="plus" class="cal">+</button>
            <button id="plus_and_minus" class="cal">+/-</button>
            <button id="num" class="cal"">0</button>
            <button id="decimal" class="cal">.</button>
            <button id="result" class="cal">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
